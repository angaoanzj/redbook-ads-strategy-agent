# 仅在本仓库根目录使用：
#   cd /Users/llan/Documents/xiaohongshu-agent
#   docker compose up -d --build
#
# 与课程仓 xiaozhe-E-commerce/xiaohongshu-strategy-agent 的 Docker 项目完全隔离。
name: xiaohongshu-agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: xiaohongshu-agent:latest
    container_name: xiaohongshu-agent
    ports:
      - "8010:8010"
    volumes:
      # 代码与数据均来自本仓库路径，不依赖旧课程仓
      - .:/app
      - ./data:/app/data
      - ./web:/app/web
    env_file:
      - .env
    environment:
      # Analyzer：模块 Agent / 报告（可指向 DeepSeek）
      AGENT_ANALYZER_API_KEY: "${AGENT_ANALYZER_API_KEY:-}"
      AGENT_ANALYZER_BASE_URL: "${AGENT_ANALYZER_BASE_URL:-}"
      AGENT_ANALYZER_MODEL: "${AGENT_ANALYZER_MODEL:-}"
      # Embedding：向量检索默认硅基
      AGENT_EMBEDDING_API_KEY: "${AGENT_EMBEDDING_API_KEY:-}"
      AGENT_EMBEDDING_BASE_URL: "${AGENT_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}"
      AGENT_EMBEDDING_MODEL: "${AGENT_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-4B}"
      # Critic 二审（默认关闭；开启后强模型只审策略文本）
      AGENT_CRITIC_ENABLED: "${AGENT_CRITIC_ENABLED:-}"
      AGENT_CRITIC_MODEL: "${AGENT_CRITIC_MODEL:-}"
      # 兼容旧变量（Analyzer 未设时回退到这里）
      AGENT_OPENAI_API_KEY: "${AGENT_OPENAI_API_KEY:-}"
      AGENT_OPENAI_BASE_URL: "${AGENT_OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}"
      AGENT_OPENAI_MODEL: "${AGENT_OPENAI_MODEL:-Qwen/Qwen3-8B}"
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8010/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
